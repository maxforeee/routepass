name: Build APK

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode (debug or profile; release not available yet, no keystore)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - profile

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Static analysis (fails on any issue)
        run: flutter analyze

      - name: Run tests (fails on any failure)
        run: flutter test

      - name: Build APK
        run: flutter build apk --${{ github.event.inputs.build_mode || 'debug' }} --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: routepass-apk-${{ github.event.inputs.build_mode || 'debug' }}
          path: build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Build summary
        run: |
          echo "### APK build finished" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: ${{ github.event.inputs.build_mode || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          du -h build/app/outputs/flutter-apk/*.apk | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

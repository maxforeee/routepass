name: Build APK

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode (debug, profile or release)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - profile
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Static analysis (fails on any issue)
        run: flutter analyze

      - name: Run tests (fails on any failure)
        run: flutter test

      - name: Restore release keystore (release only)
        if: ${{ (github.event.inputs.build_mode || 'debug') == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/routepass-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$GITHUB_WORKSPACE/android/app/routepass-release.jks" > android/key.properties
          ls -l android/app/routepass-release.jks android/key.properties

      - name: Build APK
        run: flutter build apk --${{ github.event.inputs.build_mode || 'debug' }} --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: routepass-apk-${{ github.event.inputs.build_mode || 'debug' }}
          path: build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Build summary
        run: |
          echo "### APK build finished" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: ${{ github.event.inputs.build_mode || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          du -h build/app/outputs/flutter-apk/*.apk | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
